  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys

        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();

 -.01em\">Where's my file?<\u002Fh2>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #B4AFC4\">Find your order number to see its stage. Example entries shown; the live board lives on Trello.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"#queue\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border: 1px solid rgba(255,255,255,.5); border-radius: 0 0 18px 0; color: #FFFFFF; text-decoration: none; font-weight: 600\">Open Trello board →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"overflow-x: auto\">\n      <div style=\"display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 14px; min-width: 1080px\">\n        <sc-for list=\"{{queue}}\" as=\"col\" hint-placeholder-count=\"5\">\n          <div style=\"display: grid; gap: 10px; align-content: start; padding: 14px; border-radius: 0 0 24px 0; background: #18161E; border: 1px solid #2E2A3B\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 4px 6px\"><span style=\"font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .14em\">{{col.name}}<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A9A4BA\">{{col.count}}<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{col.items}}\" as=\"q\" hint-placeholder-count=\"2\">\n              <div style=\"display: grid; gap: 6px; padding: 12px; border-radius: 10px; background: #211E29\">\n                <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A9A4BA\">{{q.no}}<\u002Fspan>\n                <span style=\"font-size: 14px; font-weight: 600\">{{q.what}}<\u002Fspan>\n                <span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: #CFCBDB\"><span style=\"{{q.dot}}\"><\u002Fspan>{{q.who}}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        < {toggles}}\" as=\"tg\" hint-placeholder-count=\"12\">\n          <div style=\"display: grid; gap: 10px; padding: 12px; border: 1px solid #2E2A3B; border-radius: 0 0 20px 0; background: #18161E\">\n            <div style=\"aspect-ratio: 1; border-radius: 8px; border: 1px dashed rgba(255,255,255,.25); display: grid; place-items: center; background: #211E29\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8F8AA3\">{{tg.code}}<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 6px\"><span style=\"font-size: 14px; font-weight: 600\">{{tg.name}}<\u002Fspan><span style=\"font-family: 'Chakra Petch', sans-serif; font-size: 10.5px; letter-spacing: .1em; color: #A9A4BA\">{{tg.kind}}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ TOS + FAQ ============ -->\n  <section id=\"tos\" aria-labelledby=\"tos-h\" style=\"max-width: 1360px; margin: 0 auto; padding: 100px clamp(16px, 4vw, 40px); display: grid; gap: 56px\">\n    <div style=\"display: grid; gap: 28px\">\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px\">\n        <div style=\"display: grid; gap: 12px\">\n          <span style=\"font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .2em; color: {{accentLight}}\">◇ TOS<\u002Fspan>\n          <h2 id=\"tos-h\" style=\"margin: 0; font-weight: 800; font-size: clamp(40px, 5.4vw, 72px); line-height: 1; letter-spacing: -.01em\">Terms of service<\u002Fh2>\n        <\u002Fdiv>\n        <a href=\"#tos\" style=\"font-weight: 600\">Read the full TOS →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n        <div style=\"padding: 24px; border: 1px solid rgba(255,255,255,.22); border-radius: 0 0 ont-size: 14px; font-weight: 600\">Email or Discord<\u002Flabel><input id=\"dk-contact\" type=\"text\" placeholder=\"Where should we reply?\" style=\"min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A3648; background: #111015; color: #FFFFFF; font-size: 15px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <fieldset style=\"margin: 0; padding: 0; border: 0; display: grid; gap: 8px\">\n          <legend style=\"font-size: 14px; font-weight: 600; margin-bottom: 8px\">Preferred artist<\u002Flegend>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n            <label style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #8FA6F5; background: rgba(91,123,234,.14); font-size: 14px; cursor: pointer\"><input type=\"radio\" name=\"dk-artist\" checked=\"\" style=\"accent-color: #8FA6F5\">Lumen<\u002Flabel>\n            <label style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3648; font-size: 14px; cursor: pointer\"><input type=\"radio\" name=\"dk-artist\" style=\"accent-color: #E0566B\">Nocturne<\u002Flabel>\n            <label style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3648; font-size: 14px; cursor: pointer\"><input type=\"radio\" name=\"dk-artist\" style=\"accent-color: #3CC1B3\">Axis (rig only)<\u002Flabel>\n            <label style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3648; font-size: 14px; cursor: pointer\"><input type=\"radio\" name=\"dk-artist\" style=\"accent-color: {{accentLight}}\">Match me<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Ffieldset>\n        <div style=\"display: grid; gap: 6px\"><label for=\"dk-refs\" style=\"font-size: 14px; font-weight: 600\">Reference link (Google Drive, Imgur, Pinterest board)<\u002Flabel><input id=\"dk-refs\" type=\"text\" placeholder=\"https://\" style=\"min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A3648; background: #111015; color: #FFFFFF; font-size: 15px\"><\u002Fdiv>\n        <div style=\"display: grid; gap: 6px\"><label for=\"dk-notes\" style=\"font-size: 14px; font-weight: 600\">Tell us about your character<\u002Flabel><textarea id=\"dk-notes\" rows=\"4\" placeholder=\"Personality, pose ideas, mood, toggles you want…\" style=\"padding: 12px 14px; border-radius: 10px; border: 1px solid #3A3648; background: #111015; color: #FFFFFF; font-size: 15px; line-height: 1.5; resize: vertical\"><\u002Ftextarea><\u002Fdiv>\n        <label style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; cursor: pointer\"><input type=\"checkbox\" style=\"width: 18px; height: 18px; margin-top: 2px; accent-color: {{accentLight}}\">I have read the Terms of Service.<\u002Flabel>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px\">\n          <button type=\"submit\" style=\"min-height: 52px; padding: 0 30px; border-radius: 0 0 18px 0; border: 0; background: #FFFFFF; color: #111015; font-weight: 800; font-size: 16px; cursor: pointer\">Send request<\u002Fbutton>\n          <span style=\"font-size: 13.5px; color: #A9A4BA\">You won't be charged until you accept our quote.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"border-top: 1px solid #26232F\">\n    <div style=\"max-width: 1360px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 32px; font-size: 14px; color: #A9A4BA\">\n      <span style=\"display: flex; align-items: center; gap: 12px\"><span style=\"font-weight: 800; color: #FFFFFF; letter-spacing: .04em\">ENIGMA STUDIO<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px\">© 2026 · All rights reserved<\u002Fspan><\u002Fspan>\n      <span style=\"display: flex; flex-wrap: wrap; gap: 6px 22px\"><a href=\"#contact\" style=\"color: #CFCBDB\">Discord<\u002Fa><a href=\"#contact\" style=\"color: #CFCBDB\">X / Twitter<\u002Fa><a href=\"#contact\" style=\"color: #CFCBDB\">VGen<\u002Fa><a href=\"#tos\" style=\"color: #CFCBDB\">TOS<\u002Fa><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- ============ FLOATING CONTACT ============ -->\n  <a href=\"#contact\" style=\"position: fixed; left: max(20px, env(safe-area-inset-left, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 20; display: grid; justify-items: center; gap: 4px; text-decoration: none\">\n    <span style=\"width: 108px; height: 108px; border-radius: 50%; background: #F4F3F8; border: 3px solid {{accent}}; display: grid; place-items: center; box-shadow: 0 12px 30px rgba(0,0,0,.45)\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #5F5B6E; text-align: center; line-height: 1.3\">CHIBI<br>MASCOT<\u002Fspan><\u002Fspan>\n    <span style=\"font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: .1em; color: #E2B65A; text-shadow: 0 2px 0 #111015, 0 0 12px rgba(0,0,0,.6)\">CONTACT US<\u002Fspan>\n  <\u002Fa>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6E55F0&quot;,&quot;options&quot;:[&quot;#6E55F0&quot;,&quot;#B3263A&quot;,&quot;#12807A&quot;,&quot;#2B5BBF&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:9000}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { svc: 'ill', art: 'a', tier: 1, add: {}, faq: 0, gal: 'v' };\n  }\n  renderVals() {\n    const acc = this.props.accent ?? '#6E55F0';\n    const accL = 'color-mix(in srgb, ' + acc + ' 55%, #FFFFFF)';\n    const S = this.state;\n    const fmt = (n) => '$' + n.toLocaleString('en-US');\n    const dot = (c) => 'display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: ' + c;\n\n    const ARTISTS = {\n      a: { name: 'Lumen', color: '#8FA6F5', style: 'Soft cel-shaded anime, pastel color', slots: '2 of 3 slots open' },\n      b: { name: 'Nocturne', color: '#E0566B', style: 'Painterly, dramatic light and shadow', slots: '1 of 2 slots open' }\n    };\n    const AXIS_C = '#3CC1B3';\n\n    /* ---------- team ---------- */\n    const members = [\n      { key: 'a', file: '◇ FILE A · ILLUSTRATOR', name: 'LUMEN', color: ARTISTS.a.color, role: 'Illustrator · [artist name]', slots: '2 of 3 open', bg: 'linear-gradient(180deg, #2A3150, #18161E)', bio: 'Bright cel-shaded anime with pastel color and crisp line art. Shines on avatars, emotes, and cute VTuber models.', tags: ['CEL SHADING', 'PASTEL', 'EXPRESSIVE'], cta: 'Price a Lumen piece' },\n      { key: 'b', file: '◇ FILE B · ILLUSTRATOR', name: 'NOCTURNE', color: ARTISTS.b.color, role: 'Illustrator · [artist name]', slots: '1 of 2 open', bg: 'linear-gradient(180deg, #3A1820, #18161E)', bio: 'Painterly rendering with deep shadows and rim light, close to gacha splash art. Rich detail for dark fantasy designs.', tags: ['PAINTERLY', 'DRAMATIC LIGHT', 'FANTASY'], cta: 'Price a Nocturne piece' },\n      { key: 'x', file: '◇ FILE C · LIVE2D RIGGER', name: 'AXIS', color: AXIS_C, role: 'Rigger · [rigger name]', slots: '1 of 2 open', bg: 'linear-gradient(180deg, #123A37, #18161E)', bio: 'Live2D Cubism rigging with natural hair physics and expressive tracking. Rigs Lumen and Nocturne models, or your own art.', tags: ['LIVE2D', 'VTUBE STUDIO', 'PHYSICS'], cta: 'Price a rig with Axis' }\n    ].map((m) => ({\n      file: m.file, role: m.role, slots: m.slots, bio: m.bio, tags: m.tags, cta: m.cta,\n      cap: m.name[0], rest: m.name.slice(1), capStyle: 'color: ' + m.color,\n      sample: m.key === 'x' ? 'RIG DEMO CLIP' : m.name + ' STYLE SAMPLE',\n      art: 'position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: ' + m.bg,\n      pick: () => m.key === 'x' ? this.setState({ svc: 'rig', tier: 0, add: {} }) : this.setState({ art: m.key, svc: S.svc === 'rig' ? 'ill' : S.svc })\n    }));\n\n    /* ---------- gallery ---------- */\n    const galData = {\n      v: [\n        { title: 'VTuber debut · Fox shrine maiden', by: 'LUMEN × AXIS', c: ARTISTS.a.color, bg: '#232A45' },\n        { title: 'VTuber model · Vampire knight', by: 'NOCTURNE × AXIS', c: ARTISTS.b.color, bg: '#33171E' },\n        { title: 'Rig only · Client artwork', by: 'AXIS', c: AXIS_C, bg: '#13302E' },\n        { title: 'Toggle set · Seasonal outfit', by: 'LUMEN × AXIS', c: ARTISTS.a.color, bg: '#232A45' },\n        { title: 'VTuber model · Cyber oracle', by: 'NOCTURNE × AXIS', c: ARTISTS.b.color, bg: '#33171E' },\n        { title: 'Expression pack · 12 faces', by: 'AXIS', c: AXIS_C, bg: '#13302E' }\n      ],\n      i: [\n        { title: 'Half body · Original character', by: 'LUMEN', c: ARTISTS.a.color, bg: '#232A45' },\n        { title: 'Full body · Reference sheet', by: 'NOCTURNE', c: ARTISTS.b.color, bg: '#33171E' },\n        { title: 'Bust-up · Stream avatar', by: 'LUMEN', c: ARTISTS.a.color, bg: '#232A45' },\n        { title: 'Key visual · Dark fantasy', by: 'NOCTURNE', c: ARTISTS.b.color, bg: '#33171E' },\n        { title: 'Couple piece · Two OCs', by: 'LUMEN', c: ARTISTS.a.color, bg: '#232A45' },\n        { title: 'Character File card', by: 'NOCTURNE', c: ARTISTS.b.color, bg: '#33171E' }\n      ]\n    };\n    const gallery = galData[S.gal].map((g, i) => ({\n      title: g.title, by: g.by, dot: dot(g.c), ph: 'ARTWORK ' + String(i + 1).padStart(2, '0'),\n      box: 'aspect-ratio: 3 / 4; border-radius: 0 0 40px 0; border: 1px dashed rgba(255,255,255,.25); display: grid; place-items: center; background: linear-gradient(180deg, ' + g.bg + ', #18161E)'\n    }));\n    const tabBase = 'min-height: 48px; padding: 0 22px; border: 0; cursor: pointer; font-size: 15px; font-weight: 700; ';\n\n    /* ---------- price builder ---------- */\n    const T = {\n      ill: [\n        { name: 'Bust-up', desc: 'Head to chest. Made for avatars and profile pictures.', a: 60, b: 80, days: { a: '5–7 days', b: '7–10 days' } },\n        { name: 'Half body', desc: 'Head to waist, with room for a pose, hands, and a prop.', a: 90, b: 120, days: { a: '7–10 days', b: '10–14 days' } },\n        { name: 'Full body', desc: 'Head to toe, full outfit. Great as a reference sheet or key visual.', a: 130, b: 170, days: { a: '10–14 days', b: '14–21 days' } }\n      ],\n      model: [\n        { name: 'Standard model art', desc: '1 outfit · 3 expressions · rig-ready layered PSD', a: 450, b: 550, days: { a: '3–5 weeks', b: '4–6 weeks' } },\n        { name: 'Deluxe model art', desc: '2 outfits or hairstyles · 6 expressions · prop and toggle art', a: 700, b: 850, days: { a: '5–7 weeks', b: '6–8 weeks' } }\n      ],\n      rig: [\n        { name: 'Standard rig', desc: 'Head and body XYZ · eye and mouth tracking · hair physics · 4 toggles', a: 600, b: 600, days: { a: '4–6 weeks', b: '4–6 weeks' } },\n        { name: 'Deluxe rig', desc: 'Everything in Standard + arm movement · 10 toggles · idle animation · hotkeys', a: 950, b: 950, days: { a: '6–8 weeks', b: '6–8 weeks' } }\n      ]\n    };\n    const bundle = (i, nm, ds, d) => {\n      const m = T.model[i], r = T.rig[i];\n      const fa = m.a + r.a, fb = m.b + r.a;\n      return { name: nm, desc: ds, a: Math.round(fa * 0.9 / 5) * 5, b: Math.round(fb * 0.9 / 5) * 5, full: { a: fa, b: fb }, days: d };\n    };\n    T.pkg = [\n      bundle(0, 'Standard package', 'Standard model art + Standard rig, debut-ready', { a: '7–10 weeks', b: '8–11 weeks' }),\n      bundle(1, 'Deluxe package', 'Deluxe model art + Deluxe rig, with 2 looks and 10 toggles', { a: '10–14 weeks', b: '11–15 weeks' })\n    ];\n    const ADD = {\n      ill: [{ id: 'char', label: 'Extra character', pct: 80 }, { id: 'bg', label: 'Detailed background', flat: 40 }, { id: 'com', label: 'Commercial license', pct: 100 }, { id: 'rush', label: 'Rush (half the time)', pct: 50 }, { id: 'priv', label: 'Private (not posted)', flat: 25 }],\n      model: [{ id: 'outfit', label: 'Extra outfit', flat: 200 }, { id: 'emote', label: 'Emote pack (6)', flat: 90 }, { id: 'com', label: 'Merch license', pct: 50 }, { id: 'priv', label: 'Private (not posted)', flat: 50 }],\n      rig: [{ id: 'tog', label: '+4 toggles', flat: 120 }, { id: 'hot', label: 'Expression hotkeys', flat: 60 }, { id: 'priv', label: 'Private (not posted)', flat: 50 }],\n      pkg: [{ id: 'outfit', label: 'Extra outfit (art + rig)', flat: 380 }, { id: 'emote', label: 'Emote pack (6)', flat: 90 }, { id: 'com', label: 'Merch license', pct: 50 }, { id: 'priv', label: 'Private (not posted)', flat: 50 }]\n    };\n    const SV = [\n      { id: 'ill', name: 'Illustration', desc: 'Bust-up to full body, by Lumen or Nocturne', from: T.ill[0].a },\n      { id: 'pkg', name: 'Live2D full package', desc: 'Model art by your artist, rigged by Axis', from: T.pkg[0].a, badge: 'Save 10%' },\n      { id: 'model', name: 'Model art only', desc: 'Rig-ready layered art for your own rigger', from: T.model[0].a },\n      { id: 'rig', name: 'Rig only', desc: 'Axis rigs the layered PSD you already have', from: T.rig[0].a }\n    ];\n    const svc = S.svc, isRig = svc === 'rig', key = isRig ? 'a' : S.art;\n    const tiers = T[svc], ti = Math.min(S.tier, tiers.length - 1), tier = tiers[ti], base = tier[key];\n\n    const radio = (on, col) => 'flex: none; width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; background: #111015; border: ' + (on ? '6px solid ' + col : '2px solid #6E6A7C');\n    const cardBase = 'width: 100%; text-align: left; cursor: pointer; font: inherit; color: #F4F3F8; border-radius: 0 0 22px 0; min-height: 44px; ';\n    const onBg = (c) => 'border: 2px solid ' + c + '; background: color-mix(in srgb, ' + c + ' 14%, #18161E)';\n    const offBg = 'border: 2px solid #2E2A3B; background: #1E1B25';\n\n    const services = SV.map((s) => {\n      const on = s.id === svc;\n      return { name: s.name, desc: s.desc, from: 'from ' + fmt(s.from), hasBadge: !!s.badge, badge: s.badge || '', on: on, radio: radio(on, accL),\n        style: cardBase + 'padding: 16px 18px; display: grid; gap: 6px; align-content: start; ' + (on ? onBg(accL) : offBg),\n        pick: () => this.setState({ svc: s.id, tier: s.id === 'ill' ? 1 : 0, add: {} }) };\n    });\n    const artists = ['a', 'b'].map((k) => {\n      const A = ARTISTS[k], on = k === S.art;\n      return { name: A.name.toUpperCase(), style2: A.style, slots: A.slots, on: on, radio: radio(on, A.color),\n        swatch: 'display: block; height: 8px; background: ' + A.color,\n        style: cardBase + 'padding: 0; overflow: hidden; display: grid; gap: 6px; align-content: start; ' + (on ? onBg(A.color) : offBg),\n        pick: () => this.setState({ art: k }) };\n    });\n    const tierItems = tiers.map((t, i) => {\n      const on = i === ti;\n      return { name: t.name, desc: t.desc, price: fmt(t[key]), days: t.days[key], on: on, radio: radio(on, accL),\n        style: cardBase + 'padding: 16px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; ' + (on ? onBg(accL) : offBg),\n        pick: () => this.setState({ tier: i }) };\n    });\n    let total = base;\n    const addLines = [];\n    const addons = ADD[svc].map((x) => {\n      const on = !!S.add[x.id];\n      const cost = x.pct ? Math.round(base * x.pct / 100) : x.flat;\n      if (on) { total += cost; addLines.push({ label: x.label, price: '+' + fmt(cost) }); }\n      return { label: x.label, price: x.pct ? '+' + x.pct + '%' : '+' + fmt(x.flat), on: on, mark: on ? '✓' : '',\n        box: 'flex: none; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-size: 13px; font-weight: 700; ' + (on ? 'background: #111015; color: #FFFFFF' : 'border: 2px solid #6E6A7C'),\n        style: 'display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; ' + (on ? 'background: #FFFFFF; color: #111015; border: 1.5px solid #FFFFFF' : 'background: transparent; color: #F4F3F8; border: 1.5px solid #3A3648'),\n        toggle: () => { const add = Object.assign({}, S.add); add[x.id] = !on; this.setState({ add: add }); } };\n    });\n    const team = [];\n    if (!isRig) team.push({ name: ARTISTS[key].name, role: 'Illustration', dot: dot(ARTISTS[key].color) });\n    if (svc === 'pkg' || isRig) team.push({ name: 'Axis', role: 'Rigging', dot: dot(AXIS_C) });\n    const pay = total < 100 ? 'Paid in full upfront' : svc === 'ill' ? '50% now · 50% before files' : '3 payments of ~' + fmt(Math.ceil(total / 3));\n    const who = isRig ? 'Axis' : ARTISTS[key].name + (svc === 'pkg' ? ' × Axis' : '');\n    const codes = { ill: 'ILL', pkg: 'L2D', model: 'ART', rig: 'RIG' };\n\n    /* ---------- queue (example) ---------- */\n    const q = (no, what, who, c) => ({ no: no, what: what, who: who, dot: dot(c) });\n    const queueCols = [\n      { name: 'WAITING', items: [q('#0142', 'Full body', 'Nocturne', ARTISTS.b.color), q('#0143', 'Standard package', 'Lumen × Axis', ARTISTS.a.color)] },\n      { name: 'SKETCH', items: [q('#0139', 'Half body', 'Lumen', ARTISTS.a.color), q('#0140', 'Deluxe model art', 'Nocturne', ARTISTS.b.color)] },\n      { name: 'RENDERING', items: [q('#0136', 'Bust-up ×2', 'Lumen', ARTISTS.a.color)] },\n      { name: 'RIGGING', items: [q('#0131', 'Standard rig', 'Axis', AXIS_C), q('#0133', 'Deluxe package', 'Nocturne × Axis', ARTISTS.b.color)] },\n      { name: 'DELIVERED', items: [q('#0128', 'Half body', 'Nocturne', ARTISTS.b.color), q('#0129', 'Standard rig', 'Axis', AXIS_C)] }\n    ].map((c) => ({ name: c.name, count: String(c.items.length), items: c.items }));\n\n    /* ---------- toggles ---------- */\n    const toggles = [\n      ['Blush', 'EXPR'], ['Teary eyes', 'EXPR'], ['Heart eyes', 'EXPR'], ['Shadow face', 'EXPR'], ['Star eyes', 'EXPR'], ['Pout', 'EXPR'],\n      ['Glasses', 'TOGGLE'], ['Hat on / off', 'TOGGLE'], ['Hair down', 'TOGGLE'], ['Jacket off', 'TOGGLE'], ['Held mic', 'PROP'], ['Pet on head', 'PROP']\n    ].map((t, i) => ({ name: t[0], kind: t[1], code: (t[1] === 'EXPR' ? 'EX-' : t[1] === 'PROP' ? 'PR-' : 'TG-') + String(i + 1).padStart(2, '0') }));\n\n    /* ---------- faq ---------- */\n    const faqData = [\n      ['Lumen or Nocturne: how do I choose?', 'Lumen is bright, soft, and clean, great for cute or cozy characters. Nocturne is painterly and dramatic, great for dark fantasy and detailed outfits. Pick \"Match me\" in the form and we suggest one.'],\n      ['Can I get art from one artist and rigging from Axis?', 'Yes, that is the Live2D full package. Booking both together saves 10% and keeps the hand-off inside the studio.'],\n      ['Can Axis rig art from another artist?', 'Yes, with Rig only. Send a properly layered PSD and Axis checks it before quoting.'],\n      ['Can I pay in installments?', 'Yes, for every Live2D service: 3 payments at the start, after the art or rig check, and before final files.'],\n      ['What is the Character File card?', 'A profile poster of your character in our signature style, in 9:16 and 16:9, free with every order.']\n    ];\n    const faqs = faqData.map((f, i) => {\n      const open = S.faq === i + 1;\n      return { q: f[0], a: f[1], open: open, sign: open ? '−' : '+', toggle: () => this.setState({ faq: open ? 0 : i + 1 }) };\n    });\n\n    return {\n      accent: acc,\n      accentLight: accL,\n      members: members,\n      gallery: gallery,\n      galV: S.gal === 'v', galI: S.gal === 'i',\n      galVStyle: tabBase + (S.gal === 'v' ? 'background: #FFFFFF; color: #111015' : 'background: transparent; color: #B4AFC4'),\n      galIStyle: tabBase
